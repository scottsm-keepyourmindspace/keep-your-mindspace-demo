<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech is a Tool — Keep Your Mindspace</title>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --warning-red: #ef4444;
      --success-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .step { display: none; }
    .step.active { display: block !important; }

    h2 {
      margin-bottom: 12px;
      color: var(--text-main);
      font-size: 1.4rem;
    }

    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #334155;
      color: var(--text-main);
      border: 2px solid transparent;
      padding: 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-align: left;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: var(--accent-blue);
      background-color: #475569;
    }

    .option-btn.selected {
      border-color: var(--accent-blue);
      background-color: #0284c7;
    }

    .audio-test-btn {
      background-color: #334155;
      color: #ffffff !important;
      border: 1px solid var(--accent-blue);
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .audio-test-btn:hover {
      background-color: #0284c7;
    }

    .primary-btn {
      background-color: var(--accent-blue);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.2s ease;
    }

    .primary-btn:hover { background-color: #7dd3fc; }

    .soundwave {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 60px;
      margin: 24px 0;
    }

    .bar {
      width: 8px;
      height: 20px;
      background-color: var(--accent-blue);
      border-radius: 4px;
      animation: pulse 1s infinite alternate;
    }

    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.6s; }
    .bar:nth-child(5) { animation-delay: 0.8s; }

    @keyframes pulse {
      from { height: 15px; opacity: 0.4; }
      to { height: 50px; opacity: 1; }
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .penguin-badge {
      font-size: 3rem;
      margin-bottom: 6px;
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .dark-pattern-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 12px;
      margin-top: 12px;
      width: 100%;
    }

    .btn-trick-accept {
      background-color: var(--accent-blue);
      color: #0f172a;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      border: none;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-trick-decline {
      background: transparent;
      color: #64748b;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      padding: 4px 8px;
    }

    .breakdown-card {
      background-color: #0f172a;
      border-left: 4px solid var(--accent-blue);
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 0 8px 8px 0;
      text-align: left;
    }

    .breakdown-card h4 { color: var(--accent-blue); margin-bottom: 6px; }
    .breakdown-card p { font-size: 0.95rem; margin-bottom: 0; }

    .input-group { 
      display: flex; 
      flex-direction: column;
      gap: 12px; 
      margin-top: 12px; 
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .input-group button {
      width: 100%;
    }
  </style>

  <script>
    var selectedText = [];
    var trapAttempts = 0;

    function toggleOption(btn) {
      var text = btn.getAttribute('data-text');
      if (btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        selectedText = selectedText.filter(function(t) { return t !== text; });
      } else {
        if (selectedText.length < 3) {
          btn.classList.add('selected');
          selectedText.push(text);
        }
      }
    }

    function goToStep(stepNum) {
      var steps = document.querySelectorAll('.step');
      if (steps) {
        steps.forEach(function(s) { s.classList.remove('active'); });
      }
      var nextStep = document.getElementById('step-' + stepNum);
      if (nextStep) nextStep.classList.add('active');
    }

    function playCalibrationChime() {
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var now = audioCtx.currentTime;
        var freqs = [523.25, 659.25, 783.99]; 
        freqs.forEach(function(f, i) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + (i * 0.08));
          gain.gain.setValueAtTime(0.2, now + (i * 0.08));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + (i * 0.08));
          osc.stop(now + (i * 0.08) + 0.5);
        });
      } catch (e) {
        console.log("Audio play blocked");
      }
    }

    function getVoiceProfile(profileType) {
      if (typeof window.speechSynthesis === 'undefined') return null;
      var voices = window.speechSynthesis.getVoices();
      var englishVoices = voices.filter(function(v) { return v.lang.startsWith('en'); });

      if (profileType === 'calm') {
        return englishVoices.find(function(v) { 
          return v.name.includes('Natural') || 
                 v.name.includes('Enhanced') || 
                 v.name.includes('Premium') || 
                 v.name.includes('Google US English') ||
                 v.name.includes('Samantha');
        }) || englishVoices[0] || null;
      } else if (profileType === 'alert') {
        return englishVoices.find(function(v) { 
          return v.name.includes('Daniel') || 
                 v.name.includes('Fred') || 
                 v.name.includes('Alex') || 
                 v.name.includes('System');
        }) || englishVoices[englishVoices.length - 1] || null;
      }
      return null;
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = function() { getVoiceProfile('calm'); };
    }

    function startFullAudioSession() {
      if (selectedText.length === 0) {
        selectedText = [
          "getting lunch with friends",
          "enjoying an afternoon coffee break"
        ];
      }

      goToStep(3);

      var scriptText = "Close your eyes and breathe slowly. Picture yourself enjoying your ideal peaceful Saturday afternoon. You are experiencing " + selectedText.join(', and then ') + ". Everything feels completely quiet, peaceful, and entirely under your control...";

      if (typeof window.speechSynthesis !== 'undefined') {
        var synth = window.speechSynthesis;
        synth.cancel(); 

        var utterance = new SpeechSynthesisUtterance(scriptText);
        var calmVoice = getVoiceProfile('calm');
        if (calmVoice) utterance.voice = calmVoice;
        
        utterance.rate = 0.82;
        utterance.pitch = 0.95;

        utterance.onend = function() {
          setTimeout(function() {
            synth.cancel();
            
            var alertVoice = getVoiceProfile('alert');
            var penguinSpeech = new SpeechSynthesisUtterance("Penguin!");
            if (alertVoice) penguinSpeech.voice = alertVoice;
            penguinSpeech.rate = 1.1;
            penguinSpeech.pitch = 1.2;
            
            penguinSpeech.onend = function() {
              setTimeout(function() {
                synth.cancel();
                var openEyesSpeech = new SpeechSynthesisUtterance("Open your eyes!");
                if (alertVoice) openEyesSpeech.voice = alertVoice;
                openEyesSpeech.rate = 1.0;
                synth.speak(openEyesSpeech);

                document.getElementById('penguin-overlay').classList.add('show');
              }, 5000);
            };

            synth.speak(penguinSpeech);
          }, 400);
        };

        synth.speak(utterance);
      } else {
        setTimeout(function() {
          document.getElementById('penguin-overlay').classList.add('show');
        }, 6000);
      }
